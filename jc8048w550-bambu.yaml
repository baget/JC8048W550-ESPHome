# ── Heartbeat ─────────────────────────────────────────────────────────────────
interval:
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGI("heartbeat", "alive | heap=%u psram=%u",
                   esp_get_free_heap_size(),
                   heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
          ESP_LOGI("state", "nozzle=%.1f bed=%.1f progress=%.1f stage='%s'",
                   id(nozzle_temp).state,
                   id(bed_temp).state,
                   id(print_progress).state,
                   id(printer_stage).state.c_str());
